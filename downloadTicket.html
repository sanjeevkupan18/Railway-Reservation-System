<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Success</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        text-align: center;
        padding-bottom: 100px;
    }

    .container {
        background: #fff;
        margin: 40px auto;
        width: 80%;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    h1 {
        color: green;
        font-size: 28px;
    }

    .msg {
        margin-top: 10px;
        font-size: 18px;
        color: #333;
    }

    .ticket-links {
        margin-top: 20px;
    }

    .btn {
        display: inline-block;
        margin: 10px;
        padding: 12px 20px;
        background: #007bff;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 16px;
        transition: 0.3s;
    }

    .btn:hover {
        background: #0056b3;
    }

    .images-section {
        margin-top: 40px;
    }

    .images-section h2 {
        margin-bottom: 20px;
        font-size: 22px;
    }

    .img-row {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    .img-box {
        width: 180px;
        height: 120px;
        background-image: url(./Images/trains-railroad-station.jpg);
        object-fit: cover;
        background-size: cover;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 14px;
        color: #555;
    }
    .img-box1 {
        width: 180px;
        height: 120px;
        background-image: url(./Images/close-up-young-businesswoman-using-mobile-phone-subway-station.jpg);
        object-fit: cover;
        background-size: cover;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 14px;
        color: #555;
    }
    .img-box2 {
        width: 180px;
        height: 120px;
        background-image: url(./Images/side-view-people-traveling-by-train.jpg);
        object-fit: cover;
        background-size: cover;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 14px;
        color: #555;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Payment Successful! ✔</h1>
    <p class="msg">Your ticket has been booked successfully.</p>

    <p class="msg"><strong>Thank you for using RailMatrix.<br>Aapki Yaatra Mangalmay Hoo 🚆✨</strong></p>

    <div class="ticket-links">
        <!-- <a class="btn" href="./Images/creative-train-ticket-concept-design-modern-vector-28624736.avif" onclick="previewTicket(event)">Preview Ticket</a> -->
        <a class="btn" href="./Images/creative-train-ticket-concept-design-modern-vector-28624736.avif" download>Download Ticket</a>
    </div>

    <div class="images-section">
        <h2>Our Company Moments</h2>
        <div class="img-row">
            <div class="img-box"></div>
            <div class="img-box1"></div>
            <div class="img-box2"></div>
        </div>
    </div>
</div>


</body>
</html>
