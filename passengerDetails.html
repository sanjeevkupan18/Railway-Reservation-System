<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passenger Form UI</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #f6f6f6;
        display: flex;
        height: 100vh;
    }

    .form-container {
        width: 50%;
        background: #fff;
        padding: 20px;
        box-shadow: 2px 0 10px rgba(0,0,0,0.1);
    }

    h2 {
        margin-top: 0;
        font-size: 22px;
    }

    label {
        display: block;
        margin-top: 10px;
        font-size: 14px;
    }

    input, select {
        width: 90%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    button {
        margin-top: 15px;
        padding: 12px 20px;
        border: none;
        background: #007bff;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #0056b3;
    }

    .summary-container {
        width: 50%;
        background: #fafafa;
        padding: 20px;
        overflow-y: auto;
    }

    .passenger-card {
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        margin-bottom: 15px;
    }

    .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #fff;
        padding: 15px;
        display: flex;
        justify-content: left;
        box-shadow: 0 -3px 10px rgba(0,0,0,0.1);
    }

    .pay-btn {
        background: orange;
        color: #fff;
        padding: 12px 20px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        border: none;
    }
</style>
</head>
<body>

<div class="form-container">
    <h2>Passenger Details</h2>

    <label>Name</label>
    <input type="text" id="name" placeholder="Enter name" />

    <label>Age</label>
    <input type="number" id="age" placeholder="Enter age" />

    <label>Gender</label>
    <select id="gender">
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>

    <label>Seat Preference</label>
    <select id="preference">
        <option value="">Select</option>
        <option>Lower</option>
        <option>Middle</option>
        <option>Upper</option>
        <option>Side Lower</option>
        <option>Side Upper</option>
    </select>

    <button onclick="addPassenger()">Add Passenger</button>
</div>

<div class="summary-container" id="summary">
    <h2>Added Passengers</h2>
</div>

<div class="bottom-bar">
    <button class="pay-btn">Proceed to Pay</button>
</div>

<script>
function addPassenger() {
    const name = document.getElementById('name').value;
    const age = document.getElementById('age').value;
    const gender = document.getElementById('gender').value;
    const preference = document.getElementById('preference').value;

    if (!name || !age || !gender || !preference) {
        alert('Please fill all fields!');
        return;
    }

    const summary = document.getElementById('summary');

    const card = document.createElement('div');
    card.className = 'passenger-card';
    card.innerHTML = `
        <strong>Name:</strong> ${name} <br>
        <strong>Age:</strong> ${age} <br>
        <strong>Gender:</strong> ${gender} <br>
        <strong>Seat Preference:</strong> ${preference}
    `;

    summary.appendChild(card);

    document.getElementById('name').value = '';
    document.getElementById('age').value = '';
    document.getElementById('gender').value = '';
    document.getElementById('preference').value = '';
}
// Check before proceeding to payment
document.querySelector(".pay-btn").addEventListener("click", function () {
    const passengers = document.querySelectorAll(".passenger-card");

    if (passengers.length === 0) {
        alert("Please add at least one passenger before proceeding to pay!");
        return;
    }

    // Redirect to payment page
    window.location.href = "downloadTicket.html";   
});
</script>

</body>
</html>
